name: Case Estudo Workflow
on: pull_request

jobs:
  continuos-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Using Node.js 25.x
        uses: actions/setup-node@v3
        with:
          node-version: 25.
      - name: run install, build and test
        run: |
          npm install
          npm run build
          npm test