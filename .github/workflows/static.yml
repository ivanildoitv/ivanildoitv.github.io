# Fluxo simples para publicar conteúdo estático no GitHub Pages
name: Deploy static content to Pages

on:
  # Executa em pushes direcionados ao branch padrão
  push:
    branches: ["main"]

  # Permite executar este fluxo manualmente pela aba Actions
  workflow_dispatch:

# Define as permissões do GITHUB_TOKEN para permitir o deploy no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite apenas um deploy simultâneo, ignorando execuções na fila entre a em andamento e a mais recente.
# Porém, NÃO cancela execuções em andamento, pois queremos que os deploys em produção sejam concluídos.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Job único de deploy, pois estamos apenas publicando
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Envia o repositório inteiro
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
